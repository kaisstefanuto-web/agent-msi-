<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSI — Chaîne Agents</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0A0A; color: #F5F2EA; font-family: system-ui, sans-serif; padding: 20px 16px; max-width: 900px; margin: 0 auto; }

  .gold { color: #B8935A; }
  .soft { color: #888888; }
  .cream { color: #F5F2EA; }

  header { border-bottom: 1px solid #1E1E1E; padding-bottom: 12px; margin-bottom: 18px; }
  header .label { color: #B8935A; font-size: 9px; letter-spacing: 4px; margin-bottom: 4px; }
  header h1 { font-family: Georgia, serif; font-size: 18px; font-weight: normal; }
  header p { color: #888; font-size: 11px; margin-top: 3px; }

  .api-row { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
  .api-row input { flex: 1; background: #111; border: 1px solid #2A2A2A; color: #F5F2EA; padding: 9px 12px; border-radius: 5px; font-size: 12px; font-family: monospace; }
  .api-row input:focus { outline: none; border-color: #B8935A; }
  .api-row span { color: #888; font-size: 10px; white-space: nowrap; }

  .steps { display: flex; gap: 4px; margin-bottom: 14px; }
  .step { flex: 1; text-align: center; padding: 5px 2px; font-size: 9px; border-radius: 4px; border: 1px solid #1E1E1E; color: #888; transition: all 0.3s; }
  .step.active { border-color: #B8935A; color: #B8935A; background: #1A1500; font-weight: bold; }
  .step.done { border-color: #5A8B6F; color: #5A8B6F; background: #0A1500; }

  button { cursor: pointer; font-weight: bold; letter-spacing: 2px; border-radius: 5px; font-size: 11px; transition: all 0.2s; }
  #btn-run { width: 100%; padding: 12px; background: #B8935A; color: #0A0A0A; border: 1px solid #B8935A; margin-bottom: 14px; }
  #btn-run:disabled { background: transparent; color: #B8935A; cursor: not-allowed; }
  #btn-run:hover:not(:disabled) { background: #C8A36A; }

  #log { background: #060606; border: 1px solid #181818; border-radius: 5px; padding: 12px; height: 180px; overflow-y: auto; margin-bottom: 14px; font-family: monospace; font-size: 10.5px; color: #5A5A5A; line-height: 1.7; white-space: pre-wrap; word-break: break-all; }

  .error-box { padding: 10px 12px; background: #150505; border: 1px solid #B85A5A; border-radius: 5px; color: #C88888; font-size: 10px; margin-bottom: 12px; font-family: monospace; word-break: break-all; display: none; }

  .section { padding: 12px; background: #111; border: 1px solid #1E1E1E; border-radius: 7px; margin-bottom: 12px; display: none; }
  .section-label { color: #B8935A; font-size: 8px; letter-spacing: 3px; margin-bottom: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .field-label { color: #888; font-size: 8px; margin-bottom: 2px; }
  .field-val { color: #F5F2EA; font-size: 12px; }
  .field-val.gold { color: #B8935A; font-weight: bold; }
  .obs-text { color: #888; font-size: 10px; font-style: italic; border-top: 1px solid #1E1E1E; padding-top: 8px; margin-top: 8px; }

  .slides-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; }
  .slide-card { background: #0D0D0D; border: 1px solid #1E1E1E; border-radius: 7px; padding: 10px 11px; min-height: 90px; }
  .slide-overline { color: #B8935A; font-size: 7px; letter-spacing: 2px; font-weight: bold; margin-bottom: 5px; }
  .slide-title { color: #F5F2EA; font-family: Georgia, serif; font-size: 11px; line-height: 1.4; }
  .slide-gold { color: #B8935A; font-weight: bold; }
  .slide-sub { color: #888; font-size: 9px; margin-top: 3px; line-height: 1.4; }
  .slide-sig { color: #888; font-size: 9px; text-align: center; padding-top: 8px; }

  .qual-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 8px; }
  .score-dot { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .score-circle { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: bold; }
  .score-sq { width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: bold; }
  .score-label { color: #888; font-size: 8px; }
  .verdict-badge { padding: 2px 10px; border-radius: 20px; color: #fff; font-size: 9px; font-weight: bold; }
  .qual-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .qual-note { color: #888; font-size: 10px; font-style: italic; border-top: 1px solid #1E1E1E; padding-top: 8px; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="label">MASTER SERVE INSTITUTE</div>
  <h1>Chaîne agents autonome — Production carrousels</h1>
  <p>Agent 0 → Agent 1 → Format → Qualité MSI</p>
</header>

<div class="api-row">
  <input type="password" id="api-key" placeholder="sk-ant-api03-..." autocomplete="off" />
  <span>Clé Anthropic</span>
</div>

<div class="steps">
  <div class="step" id="s1">1. Obs.</div>
  <div class="step" id="s2">2. Édit.</div>
  <div class="step" id="s3">3. Format</div>
  <div class="step" id="s4">4. Qualité</div>
  <div class="step" id="s5">5. ✓</div>
</div>

<button id="btn-run" onclick="runChain()">▶  LANCER LA CHAÎNE</button>

<div id="log">En attente du lancement...</div>
<div class="error-box" id="err-box"></div>

<!-- Editorial -->
<div class="section" id="sec-editorial">
  <div class="section-label">AGENT 1 — SÉLECTION ÉDITORIALE</div>
  <div class="grid3">
    <div><div class="field-label">SUJET</div><div class="field-val" id="f-sujet"></div></div>
    <div><div class="field-label">ANGLE</div><div class="field-val" id="f-angle"></div></div>
    <div><div class="field-label">FORMAT</div><div class="field-val gold" id="f-format"></div></div>
  </div>
  <div class="obs-text" id="f-obs"></div>
</div>

<!-- Slides -->
<div class="section" id="sec-slides">
  <div class="section-label" id="slides-label">SLIDES</div>
  <div class="slides-grid" id="slides-grid"></div>
</div>

<!-- Quality -->
<div class="section" id="sec-qual">
  <div class="qual-head">
    <div class="section-label">AGENT QUALITÉ MSI</div>
    <div class="verdict-badge" id="verdict-badge"></div>
  </div>
  <div class="qual-row" id="scores-row"></div>
  <div class="qual-note" id="qual-note"></div>
</div>

<script>
let logEl, running = false;

function initLog() { logEl = document.getElementById('log'); }

function addLog(t) {
  const el = document.getElementById('log');
  if (el.textContent === 'En attente du lancement...') el.textContent = '';
  el.textContent += t + '\n';
  el.scrollTop = el.scrollHeight;
}

function setStep(n) {
  for (let i = 1; i <= 5; i++) {
    const el = document.getElementById('s' + i);
    el.className = 'step' + (i < n ? ' done' : i === n ? ' active' : '');
  }
}

function showError(msg) {
  const el = document.getElementById('err-box');
  el.style.display = 'block';
  el.textContent = '✗ ' + msg;
}

async function ask(prompt) {
  const key = document.getElementById('api-key').value.trim();
  if (!key) throw new Error('Clé API manquante — renseigne ta clé Anthropic en haut');

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
    },
    body: JSON.stringify({
      model: 'claude-3-5-sonnet-20241022',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }],
    }),
  });

  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'API error ' + res.status);
  const text = data.content?.[0]?.text;
  if (!text) throw new Error('Réponse vide de l API');
  return text;
}

function parseJSON(text) {
  let s = text.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
  try { return JSON.parse(s); } catch {}
  const m = s.match(/\{[\s\S]*\}/);
  if (m) try { return JSON.parse(m[0]); } catch {}
  throw new Error('JSON invalide: ' + s.slice(0, 100));
}

function renderSlide(slide) {
  const div = document.createElement('div');
  div.className = 'slide-card';

  const ol = document.createElement('div');
  ol.className = 'slide-overline';
  ol.textContent = slide.type === 'signature' ? 'SIGNATURE' : (slide.overline || 'S' + slide.num);
  div.appendChild(ol);

  if (slide.type === 'signature') {
    const sig = document.createElement('div');
    sig.className = 'slide-sig';
    sig.textContent = 'Master Serve Institute';
    div.appendChild(sig);
  } else if (slide.idee_recue) {
    const t = document.createElement('div');
    t.className = 'slide-title';
    t.style.color = '#888';
    t.textContent = slide.idee_recue;
    div.appendChild(t);
  } else if (slide.title_blanc) {
    const t = document.createElement('div');
    t.className = 'slide-title';
    t.innerHTML = slide.title_blanc + ' <span class="slide-gold">' + slide.title_dore + '</span>';
    div.appendChild(t);
  } else if (slide.title_noir) {
    const t = document.createElement('div');
    t.className = 'slide-title';
    t.innerHTML = slide.title_noir + '<br><span class="slide-gold">' + slide.title_dore + '</span>';
    div.appendChild(t);
    if (slide.subtitle) {
      const s = document.createElement('div');
      s.className = 'slide-sub';
      s.textContent = slide.subtitle;
      div.appendChild(s);
    }
  } else {
    if (slide.title) {
      const t = document.createElement('div');
      t.className = 'slide-title';
      t.textContent = slide.title;
      div.appendChild(t);
    }
    const sub = slide.subtitle || slide.subtitle_1;
    if (sub) {
      const s = document.createElement('div');
      s.className = 'slide-sub';
      s.textContent = sub;
      div.appendChild(s);
    }
  }
  return div;
}

function scoreColor(v) {
  if (!v) return '#333';
  return v >= 8 ? '#5A8B6F' : v >= 6 ? '#B88A5A' : '#B85A5A';
}

async function runChain() {
  if (running) return;
  running = true;

  document.getElementById('btn-run').disabled = true;
  document.getElementById('btn-run').textContent = '⏳  CHAÎNE EN COURS...';
  document.getElementById('log').textContent = '';
  document.getElementById('err-box').style.display = 'none';
  document.getElementById('sec-editorial').style.display = 'none';
  document.getElementById('sec-slides').style.display = 'none';
  document.getElementById('sec-qual').style.display = 'none';

  try {
    // ── AGENT 0 ──────────────────────────────────────
    setStep(1);
    addLog('━━ AGENT 0 — Observations terrain ━━');
    const r0 = await ask(
      'Tu es Agent 0 du Master Serve Institute. ' +
      'Génère 5 observations terrain realistes d une brasserie parisienne. ' +
      'Chaque observation : concrete, neutre, visuelle, 5 a 9 mots. ' +
      'Reponds UNIQUEMENT avec du JSON valide, sans texte ni balises markdown. ' +
      'Format exact: {"observations":["phrase 1","phrase 2","phrase 3","phrase 4","phrase 5"]}'
    );
    const a0 = parseJSON(r0);
    if (!Array.isArray(a0.observations)) throw new Error('Agent 0: format observations invalide');
    a0.observations.forEach((o, i) => addLog('  ' + (i+1) + '. ' + o));
    addLog('✓ Agent 0 OK\n');

    // ── AGENT 1 ──────────────────────────────────────
    setStep(2);
    addLog('━━ AGENT 1 — Directeur editorial ━━');
    const r1 = await ask(
      'Tu es Directeur editorial du Master Serve Institute. ' +
      'Voici 5 observations: ' + a0.observations.map((o,i) => (i+1)+'. '+o).join(' | ') + '. ' +
      'Selectionne la plus pertinente. Definis angle editorial. ' +
      'Reponds UNIQUEMENT avec du JSON valide, sans texte ni balises. ' +
      'Format exact: {"observation":"texte choisi","sujet":"max 7 mots","angle":"economique ou logistique ou humain client ou humain equipe ou systemique","format":"autorite ou court ou deconstruction"}'
    );
    const a1 = parseJSON(r1);
    if (!a1.observation) throw new Error('Agent 1: observation manquante');
    document.getElementById('f-sujet').textContent = a1.sujet || '';
    document.getElementById('f-angle').textContent = a1.angle || '';
    document.getElementById('f-format').textContent = (a1.format || '').toUpperCase();
    document.getElementById('f-obs').textContent = '«' + a1.observation + '»';
    document.getElementById('sec-editorial').style.display = 'block';
    addLog('Sujet: ' + a1.sujet + ' | Angle: ' + a1.angle + ' | Format: ' + a1.format);
    addLog('✓ Agent 1 OK\n');

    // ── FORMAT ───────────────────────────────────────
    setStep(3);
    const fmt = (a1.format || 'court').toLowerCase();
    addLog('━━ PROMPT ' + fmt.toUpperCase() + ' — Generation slides ━━');

    let fmtPrompt = '';
    const base = 'Observation: "' + a1.observation + '". Sujet: "' + a1.sujet + '". Angle: ' + a1.angle + '. Ton institutionnel factuel MSI. Jamais de jugement individuel. Utilise au moins 3 parmi: dispositif, constance, signal non capte, cycle non finalise, point de fragilite, lisibilite, robustesse. ';

    if (fmt === 'autorite') {
      fmtPrompt = base +
        'Produis un carrousel 9 slides FORMAT AUTORITE. Slide 5 title exactement: "Le point invisible c est". ' +
        'Reponds UNIQUEMENT JSON sans texte ni balises. ' +
        'Format: {"format":"autorite","titre":"...","slides":[' +
        '{"num":1,"overline":"OBSERVATION TERRAIN","title":"...","subtitle":"..."},' +
        '{"num":2,"overline":"CE QUE NOUS OBSERVONS","title_blanc":"...","title_dore":"..."},' +
        '{"num":3,"overline":"LE FAIT OBSERVABLE","title":"...","subtitle":"..."},' +
        '{"num":4,"overline":"TENSION","title":"..."},' +
        '{"num":5,"overline":"","title":"Le point invisible c est"},' +
        '{"num":6,"overline":"LECTURE MSI","title_noir":"Ce n est pas...","title_dore":"C est un...","subtitle":"..."},' +
        '{"num":7,"overline":"INSIGHT","title":"...","subtitle":"..."},' +
        '{"num":8,"overline":"QUESTION","title":"Combien de...","subtitle":"..."},' +
        '{"num":9,"type":"signature"}]}';
    } else if (fmt === 'deconstruction') {
      fmtPrompt = base +
        'Produis un carrousel 6 slides FORMAT DECONSTRUCTION. ' +
        'Reponds UNIQUEMENT JSON sans texte ni balises. ' +
        'Format: {"format":"deconstruction","titre":"...","slides":[' +
        '{"num":1,"overline":"IDEE RECUE","idee_recue":"phrase exacte d un restaurateur entre guillemets","subtitle":"C est ce qu on entend souvent."},' +
        '{"num":2,"overline":"OBSERVATION TERRAIN","title":"Dans certains services...","subtitle":"..."},' +
        '{"num":3,"overline":"DEPLACEMENT","title":"Ce n est pas...","subtitle_1":"...","subtitle_2":"..."},' +
        '{"num":4,"overline":"LECTURE MSI","title_noir":"C est un...","title_dore":"terme MSI","subtitle":"..."},' +
        '{"num":5,"overline":"L ENJEU","title":"...","subtitle":"..."},' +
        '{"num":6,"type":"signature"}]}';
    } else {
      fmtPrompt = base +
        'Produis un carrousel 5 slides FORMAT COURT. ' +
        'Reponds UNIQUEMENT JSON sans texte ni balises. ' +
        'Format: {"format":"court","titre":"...","slides":[' +
        '{"num":1,"overline":"","title":"assertion directe max 8 mots"},' +
        '{"num":2,"overline":"OBSERVATION TERRAIN","title":"...","subtitle":"..."},' +
        '{"num":3,"overline":"LECTURE MSI","title_noir":"Ce n est pas...","title_dore":"C est un...","subtitle":"..."},' +
        '{"num":4,"overline":"L IMPACT","title":"...","subtitle":"..."},' +
        '{"num":5,"type":"signature"}]}';
    }

    const r2 = await ask(fmtPrompt);
    const car = parseJSON(r2);
    if (!Array.isArray(car.slides)) throw new Error('Format: slides manquantes');

    const grid = document.getElementById('slides-grid');
    grid.innerHTML = '';
    car.slides.forEach(s => grid.appendChild(renderSlide(s)));
    document.getElementById('slides-label').textContent = fmt.toUpperCase() + ' · ' + car.slides.length + ' SLIDES · ' + (car.titre || '');
    document.getElementById('sec-slides').style.display = 'block';
    addLog(car.slides.length + ' slides generees ✓\n');

    // ── QUALITÉ ──────────────────────────────────────
    setStep(4);
    addLog('━━ AGENT QUALITE MSI ━━');
    const r3 = await ask(
      'Tu evalues un carrousel MSI sur 5 dimensions score 0-10. ' +
      'Carrousel: ' + JSON.stringify(car).slice(0, 500) + '. ' +
      'D1 Unicite: originalite. D2 Viralite: hook et tension. D3 Alignement MSI: vocabulaire conforme. D4 Terrain: observable dans une brasserie. D5 Structure: chaque slide remplit sa fonction. ' +
      'Verdict: VALIDE si tout bon, AJUSTEMENT si 1-2 faibles, REJETE si grave. ' +
      'Reponds UNIQUEMENT JSON sans texte ni balises. ' +
      'Format exact: {"verdict":"VALIDE","scores":{"D1":8,"D2":7,"D3":9,"D4":8,"D5":8,"global":8},"note":"une phrase de commentaire","corrections":[]}'
    );
    const qual = parseJSON(r3);

    const vc = qual.verdict === 'VALIDE' ? '#5A8B6F' : qual.verdict === 'AJUSTEMENT' ? '#B88A5A' : '#B85A5A';
    const badge = document.getElementById('verdict-badge');
    badge.textContent = qual.verdict || '?';
    badge.style.background = vc;

    const row = document.getElementById('scores-row');
    row.innerHTML = '';
    [['D1','Unicité'],['D2','Viralité'],['D3','MSI'],['D4','Terrain'],['D5','Structure']].forEach(([k,l]) => {
      const v = qual.scores?.[k];
      const div = document.createElement('div');
      div.className = 'score-dot';
      div.innerHTML = '<div class="score-circle" style="background:' + scoreColor(v) + '">' + (v || '?') + '</div><div class="score-label">' + l + '</div>';
      row.appendChild(div);
    });
    const glob = document.createElement('div');
    glob.className = 'score-dot';
    const gv = qual.scores?.global;
    glob.innerHTML = '<div class="score-sq" style="background:' + scoreColor(gv) + '">' + (gv || '?') + '</div><div class="score-label">Global</div>';
    row.appendChild(glob);

    if (qual.note) document.getElementById('qual-note').textContent = qual.note;
    document.getElementById('sec-qual').style.display = 'block';
    addLog('Verdict: ' + qual.verdict + ' | Score: ' + (qual.scores?.global || '?') + '/10');
    addLog('Note: ' + (qual.note || ''));

    setStep(5);
    addLog('\n✅ CHAINE TERMINEE — Carrousel pret');

  } catch(e) {
    showError(e.message);
    addLog('❌ ERREUR: ' + e.message);
  } finally {
    running = false;
    document.getElementById('btn-run').disabled = false;
    document.getElementById('btn-run').textContent = '▶  LANCER LA CHAÎNE';
  }
}
</script>
</body>
</html>
